<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<section class="container conflict-view">
  <div class="card conflict-heading">
    <div>
      <h2>Resolução de Conflitos</h2>
      <p>Abordagens de conflito por membro e sugestões de mediação entre dois membros.</p>
    </div>
    <button class="btn" type="button" onclick="loadPage('CommunicationGuide')" style="background:#f0f0f0;color:var(--primary-color);">Guia de Comunicação</button>
  </div>

  <figure class="metateca-inline-guide">
    <img class="metateca-asset" data-asset-name="ponte_restaurativa.svg" hidden
      alt="Ponte restaurativa com etapas de escuta, entendimento, pedido, acordo e revisão">
    <figcaption>A ponte admite retorno e revisão. A sugestão automatizada prepara o diálogo, mas não decide nem registra um acordo.</figcaption>
  </figure>

  <div id="conflict-state" class="card">Carregando...</div>

  <div id="conflict-content" style="display:none;">
    <!-- Individual approach -->
    <div class="card" data-asset-background="cartas_mediacao.webp">
      <div class="conflict-section-head">
        <h3>Abordagem Individual</h3>
        <select id="cr-member" class="conflict-select"></select>
      </div>
      <div id="cr-individual"></div>
    </div>

    <!-- Mediation between two members -->
    <div class="card" data-asset-background="cartas_mediacao.webp">
      <div class="conflict-section-head">
        <h3>Mediação entre Dois Membros</h3>
        <div class="conflict-pair-picker">
          <select id="cr-a" class="conflict-select"></select>
          <span class="conflict-vs">×</span>
          <select id="cr-b" class="conflict-select"></select>
        </div>
      </div>
      <div id="cr-mediation"></div>
    </div>
  </div>
</section>

<style>
  .conflict-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .conflict-heading p { color: var(--text-muted); }
  .conflict-section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .conflict-section-head h3 { color: var(--primary-color); }
  .conflict-select { padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 0.92em; min-width: 170px; }
  .conflict-select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
  .conflict-pair-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .conflict-vs { font-weight: 800; color: var(--text-muted); }
  .conflict-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .conflict-chip { background: var(--primary-color); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; font-weight: 700; }
  .conflict-lead { color: var(--text-main); margin-bottom: 14px; }
  .conflict-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .conflict-box { background: #f9f9f9; border-radius: 6px; padding: 14px; border-left: 4px solid var(--primary-color); }
  .conflict-box.avoid { border-left-color: var(--error); }
  .conflict-box.success { border-left-color: var(--success); }
  .conflict-box h4 { margin-bottom: 8px; color: var(--text-main); }
  .conflict-list { margin: 0; padding-left: 18px; }
  .conflict-list li { margin: 5px 0; color: var(--text-muted); }
  .conflict-muted { color: var(--text-muted); }
  .conflict-score { display: inline-block; background: var(--primary-color); color: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 700; }
</style>

<script>
  (function() {
    var elementLabels = { Fire: 'Fogo', Earth: 'Terra', Air: 'Ar', Water: 'Água' };
    var modalityLabels = { Cardinal: 'Cardinal', Fixed: 'Fixo', Mutable: 'Mutável' };
    var signLabels = {
      Aries: 'Áries', Taurus: 'Touro', Gemini: 'Gêmeos', Cancer: 'Câncer', Leo: 'Leão', Virgo: 'Virgem',
      Libra: 'Libra', Scorpio: 'Escorpião', Sagittarius: 'Sagitário', Capricorn: 'Capricórnio', Aquarius: 'Aquário', Pisces: 'Peixes'
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function label(map, v) { return map[v] || v || '-'; }
    function list(items, empty) {
      if (!Array.isArray(items) || !items.length) return '<p class="conflict-muted">' + escapeHtml(empty || '-') + '</p>';
      return '<ul class="conflict-list">' + items.map(function(i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>';
    }

    function showState(msg) {
      document.getElementById('conflict-state').style.display = '';
      document.getElementById('conflict-state').innerHTML = msg;
      document.getElementById('conflict-content').style.display = 'none';
    }

    function renderIndividual(d) {
      document.getElementById('cr-individual').innerHTML =
        '<div class="conflict-chips">' +
          '<span class="conflict-chip">' + escapeHtml(label(signLabels, d.sunSign)) + '</span>' +
          '<span class="conflict-chip">' + escapeHtml(label(elementLabels, d.element)) + '</span>' +
          '<span class="conflict-chip">' + escapeHtml(label(modalityLabels, d.modality)) + '</span>' +
        '</div>' +
        '<p class="conflict-lead"><strong>Estilo em conflito:</strong> ' + escapeHtml(d.conflictStyle || '-') + '</p>' +
        '<p class="conflict-lead"><strong>Como resolver:</strong> ' + escapeHtml(d.resolutionApproach || '-') + '</p>' +
        '<div class="conflict-grid">' +
          '<div class="conflict-box"><h4>Comunicação durante o conflito</h4>' + list(d.communicationDuringConflict, 'Sem dicas.') + '</div>' +
          '<div class="conflict-box avoid"><h4>O que evitar</h4>' + list(d.thingsToAvoid, 'Sem itens.') + '</div>' +
          '<div class="conflict-box success"><h4>Fatores de sucesso</h4>' + list(d.successFactors, 'Sem fatores.') + '</div>' +
        '</div>';
    }

    function renderMediation(d) {
      document.getElementById('cr-mediation').innerHTML =
        '<p class="conflict-lead"><strong>' + escapeHtml(d.member1 || '-') + '</strong> e <strong>' + escapeHtml(d.member2 || '-') + '</strong> · ' +
          '<span class="conflict-score">' + escapeHtml(d.compatibility != null ? d.compatibility + '% compatível' : '-') + '</span></p>' +
        '<p class="conflict-lead"><strong>Abordagem de mediação:</strong> ' + escapeHtml(d.approach || '-') + '</p>' +
        '<div class="conflict-grid">' +
          '<div class="conflict-box"><h4>Terreno neutro</h4><p class="conflict-muted">' + escapeHtml(d.neutralGround || '-') + '</p></div>' +
          '<div class="conflict-box success"><h4>Perfil do mediador ideal</h4>' + list(d.mediatorTraits, 'Sem sugestões.') + '</div>' +
        '</div>';
    }

    async function loadIndividual(memberId) {
      if (!memberId) return;
      try {
        Utils.showLoading();
        document.getElementById('cr-individual').innerHTML = '<p class="conflict-muted">Carregando...</p>';
        var result = await Utils.callServer('getConflictApproach', [memberId]);
        if (!result || !result.success || !result.data) {
          document.getElementById('cr-individual').innerHTML = '<p class="conflict-muted">' + escapeHtml((result && (result.error || result.message)) || 'Não foi possível carregar.') + '</p>';
          return;
        }
        renderIndividual(result.data);
      } catch (error) {
        console.error('Erro abordagem individual:', error);
        document.getElementById('cr-individual').innerHTML = '<p class="conflict-muted">Erro ao carregar.</p>';
      } finally {
        Utils.hideLoading();
      }
    }

    async function loadMediation() {
      var a = document.getElementById('cr-a').value;
      var b = document.getElementById('cr-b').value;
      var box = document.getElementById('cr-mediation');
      if (!a || !b) { box.innerHTML = '<p class="conflict-muted">Selecione dois membros.</p>'; return; }
      if (a === b) { box.innerHTML = '<p class="conflict-muted">Selecione <strong>dois membros diferentes</strong> para a mediação.</p>'; return; }
      try {
        Utils.showLoading();
        box.innerHTML = '<p class="conflict-muted">Carregando...</p>';
        var result = await Utils.callServer('getMediation', [a, b]);
        if (!result || !result.success || !result.data) {
          box.innerHTML = '<p class="conflict-muted">' + escapeHtml((result && (result.error || result.message)) || 'Não foi possível carregar.') + '</p>';
          return;
        }
        renderMediation(result.data);
      } catch (error) {
        console.error('Erro mediação:', error);
        box.innerHTML = '<p class="conflict-muted">Erro ao carregar mediação.</p>';
      } finally {
        Utils.hideLoading();
      }
    }

    async function init() {
      if (!window.Utils || typeof Utils.callServer !== 'function') {
        showState('<p>Utilitários do aplicativo indisponíveis.</p>');
        return;
      }
      var params = new URLSearchParams(window.location.search);
      var requested = params.get('memberId') || params.get('email') || '';
      try {
        Utils.showLoading();
        var listResult = await Utils.callServer('getTeamMembers');
        var members = (listResult && listResult.success && Array.isArray(listResult.data)) ? listResult.data : [];
        if (!members.length) {
          showState('<h2>Nenhum membro</h2><p>Cadastre membros para ver abordagens de conflito.</p><button class="btn btn-primary" onclick="loadPage(\'AddMember\')">Adicionar membro</button>');
          return;
        }

        var opts = members.map(function(m) {
          return '<option value="' + escapeHtml(m.email) + '">' + escapeHtml(m.name || m.email) + ' — ' + escapeHtml(label(signLabels, m.sunSign)) + '</option>';
        }).join('');

        var sel = document.getElementById('cr-member');
        sel.innerHTML = opts;
        var initial = members.filter(function(m) { return String(m.email).toLowerCase() === String(requested).toLowerCase(); })[0] || members[0];
        sel.value = initial.email;
        sel.addEventListener('change', function() { loadIndividual(sel.value); });

        var selA = document.getElementById('cr-a');
        var selB = document.getElementById('cr-b');
        var mediationBox = document.getElementById('cr-mediation');
        if (members.length >= 2) {
          selA.innerHTML = opts;
          selB.innerHTML = opts;
          selA.selectedIndex = 0;
          selB.selectedIndex = 1;
          selA.addEventListener('change', loadMediation);
          selB.addEventListener('change', loadMediation);
        } else {
          selA.style.display = 'none';
          selB.style.display = 'none';
          document.querySelector('.conflict-vs').style.display = 'none';
        }

        document.getElementById('conflict-state').style.display = 'none';
        document.getElementById('conflict-content').style.display = '';

        await loadIndividual(initial.email);
        if (members.length >= 2) { await loadMediation(); }
        else { mediationBox.innerHTML = '<p class="conflict-muted">Cadastre pelo menos dois membros para sugestões de mediação.</p>'; }
      } catch (error) {
        console.error('Erro ao iniciar resolução de conflitos:', error);
        showState('<p>Não foi possível carregar os membros.</p>');
      } finally {
        Utils.hideLoading();
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
