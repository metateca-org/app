<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<section class="container search-view">
  <div class="card search-bar">
    <input inputmode="text" type="text" id="search-input" class="search-input" placeholder="Buscar por nome, e-mail, signo, elemento ou modalidade..."
           onkeydown="if(event.key==='Enter'){event.preventDefault();goSearch(this.value);}" autocomplete="name">
    <button class="btn btn-primary" type="button" onclick="goSearch(document.getElementById('search-input').value)"><i class="material-icons cdx-mi" aria-hidden="true">search</i> Buscar</button>
  </div>

  <div id="search-state" class="card">Digite um termo para buscar membros da equipe.</div>
  <div id="search-results" class="search-results-list"></div>
</section>

<style>
  .search-bar { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-input {
    flex: 1;
    min-width: 220px;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 1em;
    font-family: inherit;
  }
  .search-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
  .search-results-list { display: flex; flex-direction: column; gap: 14px; }
  .search-result { display: flex; gap: 15px; align-items: flex-start; }
  .search-result-icon {
    width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700; flex-shrink: 0;
  }
  .search-result-body { flex: 1; min-width: 0; }
  .search-result-title { color: var(--text-main); font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .search-result-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 4px; }
  .search-result-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .search-badge { background: var(--primary-color); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; }
  .search-result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .search-empty { text-align: center; padding: 30px; color: var(--text-muted); }
</style>

<script>
  (function() {
    var elementLabels = { Fire: 'Fogo', Earth: 'Terra', Air: 'Ar', Water: 'Água' };
    var modalityLabels = { Cardinal: 'Cardinal', Fixed: 'Fixo', Mutable: 'Mutável' };
    var signLabels = {
      Aries: 'Áries', Taurus: 'Touro', Gemini: 'Gêmeos', Cancer: 'Câncer', Leo: 'Leão', Virgo: 'Virgem',
      Libra: 'Libra', Scorpio: 'Escorpião', Sagittarius: 'Sagitário', Capricorn: 'Capricórnio', Aquarius: 'Aquário', Pisces: 'Peixes'
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function label(map, value) { return map[value] || value || '-'; }

    function getQuery() {
      var params = new URLSearchParams(window.location.search);
      return (params.get('q') || params.get('query') || '').trim();
    }

    function setState(message) {
      var state = document.getElementById('search-state');
      state.style.display = '';
      state.innerHTML = message;
      document.getElementById('search-results').innerHTML = '';
    }

    function resultCard(m) {
      var initial = (String(m.name || '?').trim().charAt(0) || '?').toUpperCase();
      var email = encodeURIComponent(m.email || '');
      return '<div class="card search-result">' +
        '<div class="search-result-icon">' + escapeHtml(initial) + '</div>' +
        '<div class="search-result-body">' +
          '<div class="search-result-title">' + escapeHtml(m.name || 'Sem nome') + '</div>' +
          '<div class="search-result-meta">' + escapeHtml(m.email || '-') + (m.birthLocation ? ' · ' + escapeHtml(m.birthLocation) : '') + '</div>' +
          '<div class="search-result-badges">' +
            '<span class="search-badge">' + escapeHtml(label(signLabels, m.sunSign)) + '</span>' +
            '<span class="search-badge">' + escapeHtml(label(elementLabels, m.element)) + '</span>' +
            '<span class="search-badge">' + escapeHtml(label(modalityLabels, m.modality)) + '</span>' +
          '</div>' +
          '<div class="search-result-actions">' +
            '<button class="btn btn-primary" onclick="openSearchMember(\'' + email + '\')">Ver Perfil</button>' +
            '<button class="btn" style="background:#f0f0f0;color:var(--primary-color);" onclick="loadPage(\'TeamDynamics\')">Ver Dinâmica</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    window.openSearchMember = function(encodedEmail) {
      var params = new URLSearchParams(window.location.search);
      params.set('page', 'index');
      params.set('view', 'MemberProfile');
      params.set('memberId', decodeURIComponent(encodedEmail || ''));
      window.location.search = params.toString();
    };

    async function runSearch() {
      var query = getQuery();
      var input = document.getElementById('search-input');
      if (input) input.value = query;

      if (!query) {
        setState('Digite um termo e pressione Enter para buscar membros da equipe.');
        return;
      }

      if (!window.Utils || typeof Utils.callServer !== 'function') {
        setState('<p>Utilitários do aplicativo indisponíveis.</p>');
        return;
      }

      try {
        Utils.showLoading();
        setState('Buscando "<strong>' + escapeHtml(query) + '</strong>"...');
        var result = await Utils.callServer('searchMembers', [query]);
        var data = (result && result.success && result.data) ? result.data : { results: [], count: 0 };
        var results = Array.isArray(data.results) ? data.results : [];

        if (!results.length) {
          setState('<div class="search-empty"><div style="font-size:2.4rem;">🔍</div>' +
            '<p>Nenhum membro encontrado para "<strong>' + escapeHtml(query) + '</strong>".</p>' +
            '<button class="btn btn-primary" onclick="loadPage(\'AddMember\')">Adicionar membro</button></div>');
          return;
        }

        document.getElementById('search-state').style.display = 'none';
        document.getElementById('search-state').innerHTML =
          '<strong>' + results.length + '</strong> resultado(s) para "' + escapeHtml(query) + '".';
        document.getElementById('search-state').style.display = '';
        document.getElementById('search-results').innerHTML = results.map(resultCard).join('');
      } catch (error) {
        console.error('Erro na busca:', error);
        setState('<p>Erro ao realizar a busca. Tente novamente.</p>');
      } finally {
        Utils.hideLoading();
      }
    }

    document.addEventListener('DOMContentLoaded', runSearch);
  })();
</script>
