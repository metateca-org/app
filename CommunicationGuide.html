<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<section class="container commguide-view">
  <div class="card commguide-heading">
    <div>
      <h2>Guia de Comunicação</h2>
      <p>Como se comunicar com cada membro, com base no elemento e modalidade do signo.</p>
    </div>
    <select id="cg-member" class="commguide-select"></select>
  </div>

  <div id="cg-state" class="card">Carregando guia...</div>

  <div id="cg-content" style="display:none;">
    <div class="card commguide-header">
      <h1 id="cg-name">-</h1>
      <div class="commguide-chips" id="cg-chips"></div>
      <p class="commguide-style" id="cg-style">-</p>
    </div>

    <div class="grid">
      <div class="card"><h3>Como se Comunicar</h3><div id="cg-how"></div></div>
      <div class="card"><h3>Motivadores</h3><div id="cg-motivators"></div></div>
    </div>

    <div class="grid">
      <div class="card"><h3>Preferências de Feedback</h3><div id="cg-feedback"></div></div>
      <div class="card"><h3>Estilo em Conflitos</h3><div id="cg-conflict"></div></div>
    </div>

    <div class="grid">
      <div class="card"><h3>Possíveis Desafios</h3><div id="cg-challenges"></div></div>
      <div class="card"><h3>Dicas de Colaboração</h3><div id="cg-collab"></div></div>
    </div>
  </div>
</section>

<style>
  .commguide-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .commguide-heading p { color: var(--text-muted); }
  .commguide-select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 0.95em; min-width: 220px; }
  .commguide-select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
  .commguide-header h1 { color: var(--text-main); margin-bottom: 10px; }
  .commguide-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .commguide-chip { background: var(--primary-color); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 700; }
  .commguide-style { color: var(--text-muted); font-size: 1.02rem; }
  .commguide-list { margin: 0; padding-left: 20px; }
  .commguide-list li { margin: 6px 0; }
  .commguide-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .commguide-tag { background: #f0f0f0; color: var(--primary-color); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 700; }
  .commguide-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .commguide-kv-item { background: #f9f9f9; border-radius: 6px; padding: 10px 12px; }
  .commguide-kv-item span { display: block; font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .commguide-muted { color: var(--text-muted); }
</style>

<script>
  (function() {
    var elementLabels = { Fire: 'Fogo', Earth: 'Terra', Air: 'Ar', Water: 'Água' };
    var modalityLabels = { Cardinal: 'Cardinal', Fixed: 'Fixo', Mutable: 'Mutável' };
    var signLabels = {
      Aries: 'Áries', Taurus: 'Touro', Gemini: 'Gêmeos', Cancer: 'Câncer', Leo: 'Leão', Virgo: 'Virgem',
      Libra: 'Libra', Scorpio: 'Escorpião', Sagittarius: 'Sagitário', Capricorn: 'Capricórnio', Aquarius: 'Aquário', Pisces: 'Peixes'
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function label(map, v) { return map[v] || v || '-'; }

    function bullets(items, empty) {
      if (!Array.isArray(items) || !items.length) return '<p class="commguide-muted">' + escapeHtml(empty || '-') + '</p>';
      return '<ul class="commguide-list">' + items.map(function(i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>';
    }
    function tags(items, empty) {
      if (!Array.isArray(items) || !items.length) return '<p class="commguide-muted">' + escapeHtml(empty || '-') + '</p>';
      return '<div class="commguide-tags">' + items.map(function(i) { return '<span class="commguide-tag">' + escapeHtml(i) + '</span>'; }).join('') + '</div>';
    }
    function kv(obj, fields) {
      var has = obj && typeof obj === 'object';
      var items = fields.filter(function(f) { return has && obj[f.key]; });
      if (!items.length) return '<p class="commguide-muted">Sem dados.</p>';
      return '<div class="commguide-kv">' + items.map(function(f) {
        return '<div class="commguide-kv-item"><span>' + escapeHtml(f.label) + '</span>' + escapeHtml(obj[f.key]) + '</div>';
      }).join('') + '</div>';
    }

    function showState(msg) {
      document.getElementById('cg-state').style.display = '';
      document.getElementById('cg-state').innerHTML = msg;
      document.getElementById('cg-content').style.display = 'none';
    }

    function render(tips) {
      document.getElementById('cg-name').textContent = tips.member || '-';
      document.getElementById('cg-chips').innerHTML =
        '<span class="commguide-chip">' + escapeHtml(label(signLabels, tips.sunSign)) + '</span>' +
        '<span class="commguide-chip">' + escapeHtml(label(elementLabels, tips.element)) + '</span>' +
        '<span class="commguide-chip">' + escapeHtml(label(modalityLabels, tips.modality)) + '</span>';
      document.getElementById('cg-style').textContent = tips.communicationStyle || '-';
      document.getElementById('cg-how').innerHTML = bullets(tips.howToCommunicateWithThem, 'Sem dicas.');
      document.getElementById('cg-motivators').innerHTML = tags(tips.motivators, 'Sem motivadores.');
      document.getElementById('cg-feedback').innerHTML = kv(tips.feedbackPreferences, [
        { key: 'style', label: 'Estilo' }, { key: 'focus', label: 'Foco' },
        { key: 'frequency', label: 'Frequência' }, { key: 'delivery', label: 'Entrega' }
      ]);
      document.getElementById('cg-conflict').innerHTML = kv(tips.conflictStyle, [
        { key: 'approach', label: 'Abordagem' }, { key: 'preference', label: 'Preferência' },
        { key: 'avoid', label: 'Evitar' }, { key: 'tip', label: 'Dica' }
      ]);
      document.getElementById('cg-challenges').innerHTML = bullets(tips.challenges, 'Sem desafios.');
      document.getElementById('cg-collab').innerHTML = bullets(tips.collaborationTips, 'Sem dicas.');
      document.getElementById('cg-state').style.display = 'none';
      document.getElementById('cg-content').style.display = '';
    }

    async function loadGuide(memberId) {
      if (!memberId) { showState('Selecione um membro.'); return; }
      try {
        Utils.showLoading();
        showState('Carregando guia...');
        var result = await Utils.callServer('getCommunicationTips', [memberId]);
        if (!result || !result.success || !result.data) {
          showState('<p>' + escapeHtml((result && (result.error || result.message)) || 'Não foi possível carregar o guia.') + '</p>');
          return;
        }
        render(result.data);
      } catch (error) {
        console.error('Erro ao carregar guia:', error);
        showState('<p>Erro ao carregar o guia de comunicação.</p>');
      } finally {
        Utils.hideLoading();
      }
    }

    async function init() {
      if (!window.Utils || typeof Utils.callServer !== 'function') {
        showState('<p>Utilitários do aplicativo indisponíveis.</p>');
        return;
      }
      var params = new URLSearchParams(window.location.search);
      var requested = params.get('memberId') || params.get('email') || '';
      try {
        Utils.showLoading();
        var listResult = await Utils.callServer('getTeamMembers');
        var members = (listResult && listResult.success && Array.isArray(listResult.data)) ? listResult.data : [];
        var select = document.getElementById('cg-member');
        if (!members.length) {
          select.style.display = 'none';
          showState('<h2>Nenhum membro</h2><p>Cadastre membros para gerar guias de comunicação.</p><button class="btn btn-primary" onclick="loadPage(\'AddMember\')">Adicionar membro</button>');
          return;
        }
        select.innerHTML = members.map(function(m) {
          return '<option value="' + escapeHtml(m.email) + '">' + escapeHtml(m.name || m.email) + ' — ' + escapeHtml(label(signLabels, m.sunSign)) + '</option>';
        }).join('');
        var initial = members.filter(function(m) { return String(m.email).toLowerCase() === String(requested).toLowerCase(); })[0] || members[0];
        select.value = initial.email;
        select.addEventListener('change', function() { loadGuide(select.value); });
        await loadGuide(initial.email);
      } catch (error) {
        console.error('Erro ao iniciar guia:', error);
        showState('<p>Não foi possível carregar os membros.</p>');
      } finally {
        Utils.hideLoading();
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
