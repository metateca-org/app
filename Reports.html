<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<section class="container">
  <div class="card">
    <h2>Relatorios</h2>
    <p>Resumo rapido dos principais resultados da equipe.</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Dinamica da Equipe</h3>
      <p id="report-team-summary">Carregando...</p>
      <button class="btn btn-primary" onclick="loadReports()">Atualizar</button>
    </div>

    <div class="card">
      <h3>Sugestoes de Papeis</h3>
      <p id="report-roles-summary">Carregando...</p>
      <button class="btn btn-primary" onclick="loadReports()">Atualizar</button>
    </div>

    <div class="card">
      <h3>Indicadores</h3>
      <p><strong>Total de membros:</strong> <span id="report-members-count">0</span></p>
      <p><strong>Compatibilidade media:</strong> <span id="report-avg-compatibility">0%</span></p>
      <p><strong>Recomendacoes:</strong> <span id="report-recommendations-count">0</span></p>
    </div>
  </div>

  <div class="card">
    <h3>Top pares de compatibilidade</h3>
    <div id="report-pairs"></div>
  </div>
</section>

<script>
  async function loadReports() {
    if (!window.Utils) return;

    try {
      Utils.showLoading();
      const membersResult = await Utils.callServer('getTeamMembers');
      const dynamicsResult = await Utils.callServer('getTeamDynamics');
      const suggestionsResult = await Utils.callServer('getProjectSuggestions');

      const members = (membersResult && membersResult.success && Array.isArray(membersResult.data)) ? membersResult.data : [];
      document.getElementById('report-members-count').textContent = members.length;

      if (dynamicsResult && dynamicsResult.success && dynamicsResult.data) {
        const data = dynamicsResult.data;
        const compatibility = data.compatibility || {};
        const pairs = Array.isArray(compatibility.pairs) ? compatibility.pairs : [];
        const topPairs = pairs.slice(0, 5);

        document.getElementById('report-avg-compatibility').textContent = String(compatibility.averageCompatibility || 0) + '%';
        document.getElementById('report-team-summary').textContent = data.overallAssessment || 'Sem avaliacao disponivel.';
        document.getElementById('report-pairs').innerHTML = renderPairs(topPairs);
      } else {
        document.getElementById('report-team-summary').textContent = 'Nao foi possivel gerar a dinamica da equipe.';
      }

      if (suggestionsResult && suggestionsResult.success && suggestionsResult.data) {
        const recs = (suggestionsResult.data.teamComposition && suggestionsResult.data.teamComposition.recommendations) ? suggestionsResult.data.teamComposition.recommendations : [];
        const firstRec = recs.length ? recs[0].suggestion : 'Equipe sem recomendacoes pendentes.';
        document.getElementById('report-recommendations-count').textContent = recs.length;
        document.getElementById('report-roles-summary').textContent = firstRec;
      } else {
        document.getElementById('report-recommendations-count').textContent = '0';
        document.getElementById('report-roles-summary').textContent = 'Nao foi possivel obter sugestoes de papeis.';
      }
    } catch (error) {
      console.error('Erro ao carregar relatorios:', error);
      document.getElementById('report-team-summary').textContent = 'Erro ao carregar relatorios.';
      document.getElementById('report-roles-summary').textContent = 'Erro ao carregar relatorios.';
    } finally {
      Utils.hideLoading();
    }
  }

  function renderPairs(pairs) {
    if (!pairs || !pairs.length) {
      return '<p>Nenhum par calculado ainda.</p>';
    }

    var items = pairs.map(function(pair) {
      return '<li style="margin:6px 0;">' +
        (pair.member1 || '-') + ' + ' + (pair.member2 || '-') +
        ' <strong>(' + (pair.compatibility || 0) + '%)</strong>' +
      '</li>';
    }).join('');

    return '<ul style="margin:0;padding-left:20px;">' + items + '</ul>';
  }

  document.addEventListener('DOMContentLoaded', loadReports);
</script>
