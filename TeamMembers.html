<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<section class="container">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
    <div>
      <h2>Membros da Equipe</h2>
      <p>Gerencie integrantes e visualize dados astrológicos principais.</p>
    </div>
    <button class="btn btn-primary" onclick="loadPage('AddMember')">+ Adicionar Membro</button>
  </div>

  <div class="card">
    <input inputmode="text" id="member-search" type="text" placeholder="Buscar por nome, e-mail ou signo" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;"  autocomplete="name">
  </div>

  <div id="members-list" class="grid"></div>
</section>

<script>
  function memberCardTemplate(member) {
    const name = member.name || 'Sem nome';
    const email = member.email || '-';
    const sign = member.sunSign || '-';
    const element = member.element || '-';
    const modality = member.modality || '-';

    return (
      '<div class="card member-card" data-search="' +
      (name + ' ' + email + ' ' + sign).toLowerCase() +
      '">' +
      '<h3 style="margin-bottom:8px;color:#333;">' + name + '</h3>' +
      '<p style="margin:0 0 12px;color:#777;">' + email + '</p>' +
      '<p style="margin:4px 0;"><strong>Signo:</strong> ' + sign + '</p>' +
      '<p style="margin:4px 0;"><strong>Elemento:</strong> ' + element + '</p>' +
      '<p style="margin:4px 0 12px;"><strong>Modalidade:</strong> ' + modality + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn btn-primary" onclick="viewMemberProfile(\'' + email + '\')">Perfil</button>' +
      '<button class="btn" style="background:#ff6b6b;color:#fff;" onclick="removeMember(\'' + email + '\', this)">Excluir</button>' +
      '</div>' +
      '</div>'
    );
  }

  async function loadMembers() {
    if (!window.Utils) return;

    try {
      Utils.showLoading();
      const result = await Utils.callServer('getTeamMembers');
      const members = (result && result.success && Array.isArray(result.data)) ? result.data : [];

      // element/modality are provided by the backend (getTeamMembers enriches them).
      const normalized = members.map(function(m) {
        return {
          name: m.name,
          email: m.email,
          sunSign: m.sunSign,
          element: m.element || '-',
          modality: m.modality || '-'
        };
      });

      const container = document.getElementById('members-list');
      if (!normalized.length) {
        container.innerHTML = '<div class="card"><p>Nenhum membro cadastrado ainda.</p></div>';
        return;
      }

      container.innerHTML = normalized.map(memberCardTemplate).join('');
      bindMemberSearch();
    } catch (error) {
      console.error('Erro ao carregar membros:', error);
      document.getElementById('members-list').innerHTML = '<div class="card"><p>Falha ao carregar membros.</p></div>';
    } finally {
      Utils.hideLoading();
    }
  }

  function bindMemberSearch() {
    const input = document.getElementById('member-search');
    const cards = Array.from(document.querySelectorAll('.member-card'));
    if (!input) return;

    input.addEventListener('input', function() {
      const term = (input.value || '').toLowerCase().trim();
      cards.forEach(function(card) {
        const haystack = card.getAttribute('data-search') || '';
        card.style.display = (!term || haystack.indexOf(term) >= 0) ? '' : 'none';
      });
    });
  }

  function viewMemberProfile(memberId) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', 'index');
    params.set('view', 'MemberProfile');
    params.set('memberId', memberId || '');
    window.location.search = params.toString();
  }

  var removingMemberIds = Object.create(null);

  async function removeMember(memberId, button) {
    if (!memberId) return;
    if (removingMemberIds[memberId]) return;
    if (!window.confirm('Confirma a exclusao do membro?')) return;

    removingMemberIds[memberId] = true;
    if (button) button.disabled = true;
    try {
      Utils.showLoading();
      Utils.showToast('Excluindo membro...', 'info');
      const result = await Utils.callServer('deleteMember', [memberId]);
      if (!result || !result.success) {
        alert('Nao foi possivel excluir o membro.');
        return;
      }
      Utils.showToast('Membro excluído.', 'success');
      await loadMembers();
    } catch (error) {
      console.error('Erro ao excluir membro:', error);
      Utils.showToast('Não foi possível excluir o membro. Tente novamente.', 'error');
      alert('Erro ao excluir membro.');
    } finally {
      delete removingMemberIds[memberId];
      if (button) button.disabled = false;
      Utils.hideLoading();
    }
  }

  document.addEventListener('DOMContentLoaded', loadMembers);
</script>
